<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="sshx icon">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="halo" cx="128" cy="128" r="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>

  <!-- Background squircle -->
  <g clip-path="url(#squircle)">
    <rect width="256" height="256" fill="#080c18"/>
    <rect width="256" height="256" fill="url(#grid)" opacity="0.6"/>
    <rect width="256" height="256" fill="url(#halo)"/>
  </g>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="url(#brand)" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Hexagon Shield & Terminal Prompt -->
  <g id="emblem">
    <!-- Outer Hex -->
    <path id="hex" d="M128 38 L206 83 L206 173 L128 218 L50 173 L50 83 Z"
          fill="#0c1222" fill-opacity="0.9" stroke="url(#brand)" stroke-width="4" stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Inner dashed accent hex -->
    <path d="M128 58 L188.5 93 L188.5 163 L128 198 L67.5 163 L67.5 93 Z"
          fill="none" stroke="#818cf8" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="4 6"/>

    <!-- Terminal Prompt: >_ -->
    <g filter="url(#glow-strong)">
      <polyline points="96,100 132,128 96,156" fill="none" stroke="#67e8f9" stroke-width="11"
                stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="142" y1="158" x2="172" y2="158" stroke="#f0abfc" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- Vertex nodes -->
    <g fill="#080c18" stroke-width="2.5">
      <circle cx="128" cy="38" r="5.5" stroke="#22d3ee"/>
      <circle cx="206" cy="83" r="5.5" stroke="#67e8f9"/>
      <circle cx="206" cy="173" r="5.5" stroke="#a5b4fc"/>
      <circle cx="128" cy="218" r="5.5" stroke="#c084fc"/>
      <circle cx="50" cy="173" r="5.5" stroke="#e879f9"/>
      <circle cx="50" cy="83" r="5.5" stroke="#38bdf8"/>
    </g>
  </g>
</svg>
