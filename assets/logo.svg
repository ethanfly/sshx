<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="sshx - Modern SSH Host Manager">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.45" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="halo" cx="130" cy="130" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-right" cx="730" cy="130" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="880" height="260" rx="20"/></clipPath>
  </defs>

  <!-- Background card -->
  <g clip-path="url(#card)">
    <rect width="880" height="260" fill="#080c18"/>
    <rect width="880" height="260" fill="url(#grid)" opacity="0.65"/>
    <rect width="880" height="260" fill="url(#halo)"/>
    <rect width="880" height="260" fill="url(#halo-right)"/>
    <!-- Subtle scan line -->
    <rect x="0" y="-40" width="880" height="40" fill="#22d3ee" opacity="0.04">
      <animate attributeName="y" from="-40" to="260" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="878" height="258" rx="19" fill="none" stroke="url(#brand)" stroke-opacity="0.45" stroke-width="1.8"/>

  <!-- Left: Hexagonal Shield & Terminal Prompt -->
  <g transform="translate(0, 0)">
    <!-- Glow Hex -->
    <path id="hex" d="M130 40 L207.9 85 L207.9 175 L130 220 L52.1 175 L52.1 85 Z"
          fill="#0c1222" fill-opacity="0.9" stroke="url(#brand)" stroke-width="3.5" stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Inner dashed accent hex -->
    <path d="M130 60 L190.5 95 L190.5 165 L130 200 L69.5 165 L69.5 95 Z"
          fill="none" stroke="#818cf8" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Terminal Prompt: >_ -->
    <g filter="url(#glow-strong)">
      <polyline points="98,102 134,130 98,158" fill="none" stroke="#67e8f9" stroke-width="10.5"
                stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="144" y1="160" x2="174" y2="160" stroke="#f0abfc" stroke-width="10.5" stroke-linecap="round">
        <animate attributeName="opacity" values="1;1;0.1;0.1" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Vertex connection nodes -->
    <g fill="#080c18" stroke-width="2.5">
      <circle cx="130" cy="40" r="5.5" stroke="#22d3ee"/>
      <circle cx="207.9" cy="85" r="5.5" stroke="#67e8f9"/>
      <circle cx="207.9" cy="175" r="5.5" stroke="#a5b4fc"/>
      <circle cx="130" cy="220" r="5.5" stroke="#c084fc"/>
      <circle cx="52.1" cy="175" r="5.5" stroke="#e879f9"/>
      <circle cx="52.1" cy="85" r="5.5" stroke="#38bdf8"/>
    </g>

    <!-- Packets orbiting the hexagon (cx, cy set to first vertex so no stray dot at 0,0) -->
    <circle cx="130" cy="40" r="3.5" fill="#67e8f9" filter="url(#glow)">
      <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#hex"/></animateMotion>
    </circle>
    <circle cx="130" cy="40" r="3" fill="#f0abfc" filter="url(#glow)">
      <animateMotion dur="5s" begin="-2.5s" repeatCount="indefinite"><mpath href="#hex"/></animateMotion>
    </circle>
  </g>

  <!-- Center: Brand & Typography -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace">
    <!-- Subtitle Prompt -->
    <text x="252" y="78" font-size="15" fill="#5eead4" font-weight="500" opacity="0.95">
      $ ssh <tspan fill="#64748b">--</tspan> but <tspan fill="#f0abfc" font-weight="700">eXtended</tspan>
    </text>

    <!-- Primary Wordmark -->
    <g>
      <text x="248" y="160" font-size="94" font-weight="800" letter-spacing="1" fill="url(#word)" filter="url(#glow-strong)">sshx</text>
      <!-- Blinking block cursor -->
      <rect x="478" y="94" width="12" height="68" rx="2" fill="#67e8f9" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.85;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Tagline -->
    <text x="252" y="198" font-size="16" fill="#94a3b8" font-weight="400">
      Cross-platform SSH host manager
    </text>

    <!-- Feature Pills -->
    <g transform="translate(252, 212)" font-size="13" font-weight="700">
      <!-- TUI -->
      <g>
        <rect x="0" y="0" width="56" height="24" rx="12" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.6"/>
        <text x="28" y="16" text-anchor="middle" fill="#67e8f9">TUI</text>
      </g>
      <!-- CLI -->
      <g transform="translate(64, 0)">
        <rect x="0" y="0" width="56" height="24" rx="12" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.6"/>
        <text x="28" y="16" text-anchor="middle" fill="#a5b4fc">CLI</text>
      </g>
      <!-- MCP -->
      <g transform="translate(128, 0)">
        <rect x="0" y="0" width="58" height="24" rx="12" fill="#e879f9" fill-opacity="0.12" stroke="#e879f9" stroke-opacity="0.6"/>
        <text x="29" y="16" text-anchor="middle" fill="#f0abfc">MCP</text>
      </g>
    </g>
  </g>

  <!-- Right: Floating TUI Preview Card -->
  <g transform="translate(628, 48)"
     font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace">
    <!-- Window frame -->
    <rect width="224" height="164" rx="12" fill="#0c1222" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"
          filter="url(#glow)"/>

    <!-- Window buttons -->
    <circle cx="16" cy="16" r="4.5" fill="#f87171" opacity="0.9"/>
    <circle cx="30" cy="16" r="4.5" fill="#fbbf24" opacity="0.9"/>
    <circle cx="44" cy="16" r="4.5" fill="#34d399" opacity="0.9"/>
    <text x="112" y="19" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">sshx launcher</text>

    <!-- Table header -->
    <line x1="8" y1="30" x2="216" y2="30" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="46" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">NAME      DEST</text>

    <!-- Active row selection -->
    <rect x="8" y="54" width="208" height="24" rx="5" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-opacity="0.35">
      <animate attributeName="y" values="54;82;110;82;54" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- Host items -->
    <g font-size="12">
      <!-- Item 1 -->
      <text x="14" y="70" fill="#38bdf8" font-weight="700">prod</text>
      <text x="82" y="70" fill="#e2e8f0">root@10.0.0.5</text>

      <!-- Item 2 -->
      <text x="14" y="98" fill="#94a3b8" font-weight="600">staging</text>
      <text x="82" y="98" fill="#94a3b8">ubuntu@10.0.1.8</text>

      <!-- Item 3 -->
      <text x="14" y="126" fill="#94a3b8" font-weight="600">bastion</text>
      <text x="82" y="126" fill="#94a3b8">ops@203.0.113.9</text>
    </g>

    <!-- Footer status -->
    <line x1="8" y1="140" x2="216" y2="140" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="154" font-size="10.5" fill="#64748b">enter <tspan fill="#38bdf8">⏎</tspan> connect</text>
    <text x="210" y="154" text-anchor="end" font-size="10.5" fill="#475569">3 hosts</text>
  </g>
</svg>
